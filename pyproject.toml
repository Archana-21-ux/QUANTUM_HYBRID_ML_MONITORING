[project]
name = "quantumguard"
version = "0.1.0"
description = "Drift-monitoring and semi-automated retraining framework for a production fraud-detection model"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "pydantic>=2.7",
    "matplotlib>=3.11.0",
    "pennylane>=0.45.1",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "debugpy>=1.8.21",
    "httpx>=0.28.1",
    "pip>=26.1.2",
    "pytest>=8.2",
]
llm = [
    "anthropic>=0.117.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantumguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
